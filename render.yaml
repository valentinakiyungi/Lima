services:
  # Backend: FastAPI
  - type: web
    name: lima-bc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false

  # Frontend: Next.js static export
  - type: web
    name: lima
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://lima-bc.onrender.com
